<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="collapseGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#collapseGradient)" />

    <!-- Collapse arrows -->
    <path d="M70 90 L100 120 L130 90" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M70 110 L100 140 L130 110" fill="none" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
</svg>
