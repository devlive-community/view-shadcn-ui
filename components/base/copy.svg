<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#copyGradient)" />

    <!-- Define gradient -->
    <defs>
        <linearGradient id="copyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#bae6fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a7f3d0;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Icon text -->
    <text x="100" y="115" fill="#FFFFFF" font-size="48" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">
        C
    </text>

    <!-- Paper icon (adjusted rectangle inside) -->
    <rect x="70" y="75" width="60" height="70" rx="8" fill="white" opacity="0.3" />
</svg>
