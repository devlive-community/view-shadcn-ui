<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="rowColGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#rowColGradient)" />

    <!-- Row structure -->
    <rect x="50" y="50" width="100" height="15" rx="7" fill="white" />
    <rect x="50" y="70" width="100" height="15" rx="7" fill="white" />
    <rect x="50" y="90" width="100" height="15" rx="7" fill="white" />

    <!-- Col structure -->
    <rect x="60" y="115" width="15" height="50" rx="7" fill="white" />
    <rect x="95" y="115" width="15" height="50" rx="7" fill="white" />
    <rect x="125" y="115" width="15" height="50" rx="7" fill="white" />
</svg>
