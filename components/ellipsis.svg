<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="ellipsisGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#ellipsisGradient)" />

    <!-- Ellipsis circles -->
    <circle cx="70" cy="100" r="10" fill="white" />
    <circle cx="100" cy="100" r="10" fill="white" />
    <circle cx="130" cy="100" r="10" fill="white" />
</svg>

