<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="paginationGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#paginationGradient)" />

    <!-- Pagination container -->
    <rect x="50" y="85" width="100" height="30" rx="15" fill="white" />

    <!-- Pagination dots -->
    <circle cx="70" cy="100" r="5" fill="#60a5fa" />
    <circle cx="100" cy="100" r="5" fill="#d1d5db" />
    <circle cx="130" cy="100" r="5" fill="#d1d5db" />

    <!-- Pagination arrows -->
    <path d="M58 100 L50 95 L50 105 Z" fill="#a5b4fc" />
    <path d="M142 100 L150 95 L150 105 Z" fill="#a5b4fc" />
</svg>
