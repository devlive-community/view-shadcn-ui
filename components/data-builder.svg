<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="dataBuilderGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#dataBuilderGradient)" />

    <!-- Data blocks -->
    <rect x="70" y="70" width="30" height="30" rx="6" fill="white" />
    <rect x="100" y="70" width="30" height="30" rx="6" fill="#e5e7eb" />
    <rect x="70" y="100" width="30" height="30" rx="6" fill="#e5e7eb" />
    <rect x="100" y="100" width="30" height="30" rx="6" fill="white" />

    <!-- Connecting lines -->
    <line x1="85" y1="85" x2="115" y2="85" stroke="#a5b4fc" stroke-width="3" />
    <line x1="85" y1="115" x2="115" y2="115" stroke="#a5b4fc" stroke-width="3" />
    <line x1="85" y1="85" x2="85" y2="115" stroke="#a5b4fc" stroke-width="3" />
    <line x1="115" y1="85" x2="115" y2="115" stroke="#a5b4fc" stroke-width="3" />
</svg>
