<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="progressGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#6ee7b7;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#progressGradient)" />

    <!-- Progress track -->
    <circle cx="100" cy="100" r="60" fill="none" stroke="#d1d5db" stroke-width="12" />

    <!-- Progress fill -->
    <path d="M100,40 A60,60 0 1,1 99.9,40" fill="none" stroke="white" stroke-width="12" stroke-linecap="round" />
</svg>
