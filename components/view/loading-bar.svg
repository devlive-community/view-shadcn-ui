<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="loadingBarGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#loadingBarGradient)" opacity="0.2" />

    <!-- Loading bar container -->
    <rect x="50" y="90" width="100" height="20" rx="10" fill="#e5e7eb" />

    <!-- Progress bar -->
    <rect x="50" y="90" width="60" height="20" rx="10" fill="url(#loadingBarGradient)" />

    <!-- Text: Loading -->
    <text x="100" y="150" font-size="14" text-anchor="middle" fill="#4b5563" font-family="Arial, sans-serif">Loading...</text>
</svg>
