<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="carouselGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background Circle -->
    <circle cx="100" cy="100" r="100" fill="url(#carouselGradient)" opacity="0.2" />

    <!-- Carousel Frame -->
    <rect x="60" y="70" width="80" height="60" rx="8" fill="white" stroke="#60a5fa" stroke-width="4" />

    <!-- Slides (3 Rectangles) -->
    <rect x="65" y="75" width="20" height="50" rx="4" fill="#93c5fd" />
    <rect x="90" y="75" width="20" height="50" rx="4" fill="#60a5fa" />
    <rect x="115" y="75" width="20" height="50" rx="4" fill="#a5b4fc" />

    <!-- Navigation Arrows -->
    <path d="M55 100 L65 95 L65 105 Z" fill="#60a5fa" />
    <path d="M145 100 L135 95 L135 105 Z" fill="#60a5fa" />
</svg>