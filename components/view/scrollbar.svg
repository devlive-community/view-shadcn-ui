<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="scrollbarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#scrollbarGradient)" />

    <!-- Scroll area -->
    <rect x="80" y="50" width="40" height="100" rx="8" fill="white" />

    <!-- Scroll thumb -->
    <rect x="85" y="75" width="30" height="20" rx="4" fill="#60a5fa" />
</svg>
