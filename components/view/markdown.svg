<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <defs>
        <linearGradient id="markdownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>
    </defs>

    <circle cx="100" cy="100" r="80" fill="url(#markdownGradient)" />

    <rect x="50" y="60" width="100" height="80" rx="8" fill="white" />

    <text x="65" y="85" font-size="20" fill="#3b82f6" font-weight="bold" font-family="Arial, sans-serif">#</text>
    <rect x="85" y="73" width="50" height="4" rx="2" fill="#e5e7eb" />

    <text x="65" y="110" font-size="16" fill="#3b82f6" font-weight="bold" font-family="Arial, sans-serif">**</text>
    <rect x="85" y="100" width="40" height="4" rx="2" fill="#e5e7eb" />

    <circle cx="70" cy="122" r="2" fill="#3b82f6" />
    <rect x="85" y="120" width="35" height="4" rx="2" fill="#e5e7eb" />
</svg>
