<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="countDownGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#countDownGradient)" />

    <!-- Clock body -->
    <circle cx="100" cy="100" r="50" fill="white" stroke="#60a5fa" stroke-width="5" />

    <!-- Clock ticks -->
    <line x1="100" y1="50" x2="100" y2="60" stroke="#a5b4fc" stroke-width="3" />
    <line x1="100" y1="150" x2="100" y2="140" stroke="#a5b4fc" stroke-width="3" />
    <line x1="50" y1="100" x2="60" y2="100" stroke="#a5b4fc" stroke-width="3" />
    <line x1="150" y1="100" x2="140" y2="100" stroke="#a5b4fc" stroke-width="3" />

    <!-- Clock hands -->
    <line x1="100" y1="100" x2="100" y2="75" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
    <line x1="100" y1="100" x2="125" y2="100" stroke="#60a5fa" stroke-width="4" stroke-linecap="round" />
</svg>
