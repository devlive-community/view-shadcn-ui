<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="messageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#messageGradient)" />

    <!-- Message bubble -->
    <path d="M50,50 L150,50 Q160,50 160,60 L160,120 Q160,130 150,130 L60,130 L50,140 L50,60 Q50,50 50,50 Z" fill="white" stroke="#60a5fa" stroke-width="3" />

    <!-- Message dot -->
    <circle cx="80" cy="90" r="5" fill="#60a5fa" />
    <circle cx="100" cy="90" r="5" fill="#60a5fa" />
    <circle cx="120" cy="90" r="5" fill="#60a5fa" />
</svg>
