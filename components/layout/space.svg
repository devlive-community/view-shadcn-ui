<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="spaceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#spaceGradient)" />

    <!-- Horizontal lines with spaces -->
    <rect x="40" y="70" width="120" height="10" rx="5" fill="white" />
    <rect x="40" y="95" width="90" height="10" rx="5" fill="white" />
    <rect x="40" y="120" width="110" height="10" rx="5" fill="white" />
</svg>
