<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="numberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#numberGradient)" />

    <!-- Number input box -->
    <rect x="60" y="75" width="80" height="50" rx="8" fill="white" />

    <!-- Up arrow -->
    <path d="M130 85 L125 90 L135 90 Z" fill="#60a5fa" />

    <!-- Down arrow -->
    <path d="M130 105 L125 100 L135 100 Z" fill="#60a5fa" />

    <!-- Placeholder for number text -->
    <rect x="70" y="90" width="40" height="8" rx="4" fill="#a5b4fc" />
</svg>
