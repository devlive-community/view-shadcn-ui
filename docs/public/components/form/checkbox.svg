<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="checkboxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#checkboxGradient)" />

    <!-- Checkbox square -->
    <rect x="70" y="70" width="60" height="60" rx="10" fill="white" stroke="#60a5fa" stroke-width="3" />

    <!-- Check mark -->
    <polyline points="75,100 90,115 125,85" fill="none" stroke="#60a5fa" stroke-width="5" />
</svg>
