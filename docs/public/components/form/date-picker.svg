<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="datePickerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="100" fill="url(#datePickerGradient)" opacity="0.2" />

    <!-- Calendar base -->
    <rect x="50" y="70" width="100" height="70" rx="10" fill="white" stroke="#93c5fd" stroke-width="3" />

    <!-- Calendar header -->
    <rect x="50" y="70" width="100" height="20" rx="5" fill="#93c5fd" />

    <!-- Calendar grid (rows and columns for dates) -->
    <circle cx="75" cy="100" r="5" fill="#a5b4fc" />
    <circle cx="95" cy="100" r="5" fill="#a5b4fc" />
    <circle cx="115" cy="100" r="5" fill="#a5b4fc" />
    <circle cx="135" cy="100" r="5" fill="#a5b4fc" />

    <circle cx="75" cy="120" r="5" fill="#a5b4fc" />
    <circle cx="95" cy="120" r="5" fill="#a5b4fc" />
    <circle cx="115" cy="120" r="5" fill="#a5b4fc" />
    <circle cx="135" cy="120" r="5" fill="#a5b4fc" />

    <!-- Selected date highlight -->
    <circle cx="95" cy="120" r="8" fill="#60a5fa" stroke="white" stroke-width="2" />

    <!-- Date icon -->
    <rect x="70" y="50" width="20" height="10" rx="3" fill="#60a5fa" />
    <rect x="110" y="50" width="20" height="10" rx="3" fill="#60a5fa" />
</svg>