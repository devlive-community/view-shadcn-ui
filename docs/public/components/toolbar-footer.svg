<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="toolbarFooterGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#toolbarFooterGradient)" />

    <!-- Toolbar area -->
    <rect x="50" y="60" width="100" height="30" rx="8" fill="white" />

    <!-- Footer bar -->
    <rect x="50" y="110" width="100" height="20" rx="5" fill="white" opacity="0.9" />

    <!-- Toolbar icons (simulated) -->
    <circle cx="70" cy="75" r="4" fill="#60a5fa" />
    <circle cx="90" cy="75" r="4" fill="#60a5fa" />
    <circle cx="110" cy="75" r="4" fill="#60a5fa" />
    <circle cx="130" cy="75" r="4" fill="#60a5fa" />
</svg>
