<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="highlightGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fef08a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#facc15;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#highlightGradient)" />

    <!-- Highlighted line -->
    <rect x="55" y="90" width="90" height="20" rx="8" fill="white" opacity="0.8" />

    <!-- Underline for highlight emphasis -->
    <rect x="55" y="115" width="90" height="8" rx="4" fill="white" opacity="0.6" />
</svg>
