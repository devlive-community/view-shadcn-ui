<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="inputGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#inputGradient)" />

    <!-- Main input rectangle -->
    <rect x="40" y="80" width="120" height="40" rx="8" fill="white" />

    <!-- Input placeholder line -->
    <rect x="50" y="95" width="100" height="10" rx="4" fill="#e5e7eb" />
</svg>
