<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#dividerGradient)" />

    <!-- Horizontal Divider -->
    <rect x="30" y="100" width="140" height="10" rx="5" fill="white" />

    <!-- Dots on either side -->
    <circle cx="60" cy="105" r="5" fill="#60a5fa" />
    <circle cx="150" cy="105" r="5" fill="#60a5fa" />
</svg>
