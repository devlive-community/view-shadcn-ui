<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="timelineGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#timelineGradient)" />

    <!-- Timeline vertical line -->
    <rect x="95" y="40" width="10" height="120" fill="white" />

    <!-- Timeline dots -->
    <circle cx="100" cy="60" r="10" fill="#60a5fa" />
    <circle cx="100" cy="100" r="10" fill="#a5b4fc" />
    <circle cx="100" cy="140" r="10" fill="#93c5fd" />
</svg>
