<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="menuGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#menuGradient)" />

    <!-- Menu lines -->
    <rect x="60" y="75" width="80" height="10" rx="5" fill="white" />
    <rect x="60" y="95" width="80" height="10" rx="5" fill="white" />
    <rect x="60" y="115" width="80" height="10" rx="5" fill="white" />
</svg>
