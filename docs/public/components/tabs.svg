<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="tabsGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#tabsGradient)" />

    <!-- Tabs container -->
    <rect x="55" y="70" width="90" height="60" rx="10" fill="white" />

    <!-- Tab items -->
    <rect x="60" y="75" width="25" height="20" rx="5" fill="#93c5fd" />
    <rect x="90" y="75" width="25" height="20" rx="5" fill="#d1d5db" />
    <rect x="120" y="75" width="25" height="20" rx="5" fill="#d1d5db" />

    <!-- Content section -->
    <rect x="60" y="100" width="80" height="20" rx="5" fill="#e5e7eb" />
</svg>
