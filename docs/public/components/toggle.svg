<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="toggleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#toggleGradient)" />

    <!-- Toggle background -->
    <rect x="60" y="80" width="80" height="40" rx="20" fill="#e5e7eb" />

    <!-- Toggle knob -->
    <circle cx="90" cy="100" r="16" fill="white" />
</svg>
