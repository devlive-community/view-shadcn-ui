<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="skeletonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#skeletonGradient)" />

    <!-- Skeleton rectangle -->
    <rect x="50" y="60" width="100" height="15" rx="8" fill="white" opacity="0.7" />
    <rect x="50" y="85" width="120" height="15" rx="8" fill="white" opacity="0.7" />
    <rect x="50" y="110" width="90" height="15" rx="8" fill="white" opacity="0.7" />
    <rect x="50" y="135" width="110" height="15" rx="8" fill="white" opacity="0.7" />
</svg>
