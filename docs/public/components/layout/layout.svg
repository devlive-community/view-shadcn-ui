<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="layoutGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#cbd5e1;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#64748b;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#layoutGradient)" />

    <!-- Layout outer rectangle -->
    <rect x="50" y="60" width="100" height="80" rx="10" fill="white" />

    <!-- Header rectangle -->
    <rect x="50" y="60" width="100" height="20" rx="10" fill="#94a3b8" />

    <!-- Content rectangle -->
    <rect x="50" y="85" width="70" height="40" rx="5" fill="#cbd5e1" />

    <!-- Sidebar rectangle -->
    <rect x="125" y="85" width="25" height="40" rx="5" fill="#94a3b8" />
</svg>
