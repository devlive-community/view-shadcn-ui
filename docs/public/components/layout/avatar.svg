<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="avatarGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#a5f3fc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#avatarGradient)" />

    <!-- Face circle -->
    <circle cx="100" cy="100" r="40" fill="white" />

    <!-- Eyes -->
    <circle cx="90" cy="95" r="5" fill="#60a5fa" />
    <circle cx="110" cy="95" r="5" fill="#60a5fa" />

    <!-- Mouth -->
    <path d="M85,110 Q100,120 115,110" stroke="#60a5fa" stroke-width="3" fill="none" />
</svg>
