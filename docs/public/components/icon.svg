<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#iconGradient)" />

    <!-- Define gradient -->
    <defs>
        <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#f0abfc;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Icon text -->
    <text x="100" y="120" fill="#FFFFFF" font-size="48" text-anchor="middle" font-family="Arial, sans-serif" font-weight="bold">
        I
    </text>
</svg>
