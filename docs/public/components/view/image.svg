<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="imageGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background Circle -->
    <circle cx="100" cy="100" r="100" fill="url(#imageGradient)" opacity="0.2" />

    <!-- Image Placeholder (Rectangle) -->
    <rect x="50" y="70" width="90" height="70" rx="8" fill="white" stroke="#60a5fa" stroke-width="4" />

    <!-- Mountain Shape -->
    <path d="M65 115 L80 95 L95 110 L110 90 L135 115 Z" fill="#93c5fd" stroke="#60a5fa" stroke-width="2" />

    <!-- Sun Placeholder (Circle) -->
    <circle cx="125" cy="85" r="8" fill="#facc15" stroke="#eab308" stroke-width="2" />
</svg>