<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="modalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#fca5a5;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#fbcfe8;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#modalGradient)" />

    <!-- Main modal rectangle -->
    <rect x="40" y="60" width="120" height="80" rx="12" fill="white" />

    <!-- Modal title line -->
    <rect x="50" y="70" width="100" height="10" rx="5" fill="#fca5a5" />

    <!-- Modal content lines -->
    <rect x="50" y="90" width="80" height="8" rx="4" fill="#e5e7eb" />
    <rect x="50" y="105" width="60" height="8" rx="4" fill="#e5e7eb" />
    <rect x="50" y="120" width="70" height="8" rx="4" fill="#e5e7eb" />

    <!-- Modal close button -->
    <rect x="150" y="70" width="10" height="10" rx="5" fill="#fca5a5" />
    <text x="155" y="78" font-size="10" fill="white" text-anchor="middle" font-family="Arial, sans-serif">×</text>
</svg>
