<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="hoverCardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
        <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
            <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="rgba(0, 0, 0, 0.2)" />
        </filter>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#hoverCardGradient)" />

    <!-- Hover card -->
    <rect x="55" y="70" width="90" height="60" rx="10" fill="white" filter="url(#shadow)" />

    <!-- Hover card title -->
    <rect x="65" y="80" width="70" height="10" rx="5" fill="#60a5fa" />

    <!-- Hover card content lines -->
    <rect x="65" y="95" width="60" height="8" rx="4" fill="#a5b4fc" />
    <rect x="65" y="110" width="50" height="8" rx="4" fill="#a5b4fc" />
</svg>
