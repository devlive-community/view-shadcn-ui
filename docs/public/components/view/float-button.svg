<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="floatButtonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#34d399;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#floatButtonGradient)" opacity="0.2" />

    <!-- Main button circle -->
    <circle cx="100" cy="100" r="40" fill="url(#floatButtonGradient)" />

    <!-- Plus icon -->
    <line x1="100" y1="85" x2="100" y2="115" stroke="white" stroke-width="8" stroke-linecap="round" />
    <line x1="85" y1="100" x2="115" y2="100" stroke="white" stroke-width="8" stroke-linecap="round" />
</svg>
