<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="backTopGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#a5b4fc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#backTopGradient)" />

    <!-- Arrow circle -->
    <circle cx="100" cy="100" r="50" fill="white" />

    <!-- Upward arrow -->
    <path d="M100 70 L85 95 H115 Z" fill="#60a5fa" />
    <rect x="95" y="95" width="10" height="30" fill="#60a5fa" rx="2" />
</svg>
