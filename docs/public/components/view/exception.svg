<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
    <!-- Define gradient -->
    <defs>
        <linearGradient id="exceptionGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#93c5fd;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#f0abfc;stop-opacity:1" />
        </linearGradient>
    </defs>

    <!-- Background circle -->
    <circle cx="100" cy="100" r="80" fill="url(#exceptionGradient)" />

    <!-- Exclamation mark -->
    <line x1="100" y1="60" x2="100" y2="110" stroke="white" stroke-width="12" stroke-linecap="round" />
    <circle cx="100" cy="140" r="10" fill="white" />
</svg>
